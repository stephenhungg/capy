name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol-and-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
      - name: install marketing and protocol dependencies
        run: npm ci
      - name: validate protocol and trust contracts
        run: npm test
      - name: validate marketing application
        run: npm run lint && npm run typecheck && npm run build
      - name: audit root javascript dependencies
        run: npm audit --audit-level=moderate
      - name: install control-plane dependencies
        run: npm ci
        working-directory: apps/web
      - name: verify control-plane migration history
        run: npm run db:generate && git diff --exit-code -- drizzle
        working-directory: apps/web
      - name: validate control-plane application
        run: npm run lint && npm run typecheck && npm run build
        working-directory: apps/web
      - name: audit control-plane dependencies
        run: npm audit --audit-level=moderate
        working-directory: apps/web

  payout-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            packages/bounty-engine/package-lock.json
            packages/solana-payouts/package-lock.json
      - name: validate bounty engine
        run: npm ci && npm test && npm audit --audit-level=moderate
        working-directory: packages/bounty-engine
      - name: validate solana payout executor
        run: npm ci && npm run check && npm test && npm run build && npm audit --audit-level=moderate
        working-directory: packages/solana-payouts

  evidence-and-evaluation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            packages/evidence-bridge/pyproject.toml
            packages/i2rt-recorder/pyproject.toml
      - name: install evidence dependencies
        run: python -m pip install -e packages/evidence-bridge -e 'packages/i2rt-recorder[dev]' pytest
      - name: validate evidence adapters and recorder
        run: python -m pytest packages/evidence-bridge/tests packages/i2rt-recorder/tests
      - name: lint evidence packages
        run: ruff check packages/evidence-bridge packages/i2rt-recorder
      - name: validate registered evaluation
        run: |
          python -m unittest discover -s experiments/tests -v
          python experiments/run.py verify
