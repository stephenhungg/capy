[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capy-i2rt-recorder"
version = "0.1.0"
description = "Camera-free, synchronized I2RT robot data recorder"
readme = {text = "Camera-free synchronized command/state recording and deterministic MCAP/LeRobot export for I2RT robots.", content-type = "text/markdown"}
requires-python = ">=3.11"
dependencies = [
  "mcap>=1.4.0,<2",
  "pyarrow>=15,<25",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.8",
]

[project.scripts]
i2rt-recorder = "i2rt_recorder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 119
target-version = "py311"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "UP"]
